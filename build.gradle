plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'modi'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// AI 임시저장(draft) 캐시 — Redis(Lettuce). '질문으로 작성' 뒤로가기 복원용 휘발성 캐시(질문+답변).
	//   운영은 64mb·allkeys-lru·비영속(compose)으로 1GB EC2 보호. 포트(AiDraftStore)+어댑터(RedisAiDraftStore)로 DIP.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// DB 마이그레이션(기록 아카이브 등) — flyway
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	// 외부 호출은 RestClient + HTTP Interface(@HttpExchange) 선언형 클라이언트(ADR-09) — spring-web(webmvc 포함)만으로 동작
	// Swagger/OpenAPI 문서 (springdoc 3.x = Spring Boot 4 라인)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	// 한눈에보는문화정보(15138937) 응답 포맷=XML. Spring 7의 기본 XML 컨버터(JacksonXmlHttpMessageConverter)가
	// Jackson 3을 쓰므로 dataformat-xml도 Jackson 3(tools.jackson) 계열을 쓴다. 버전은 Boot BOM이 관리.
	implementation 'tools.jackson.dataformat:jackson-dataformat-xml'
	// AI 감상문 생성(질문/compose) — Anthropic 공식 Java SDK. provider 추상화 뒤 Claude 어댑터에서만 사용.
	//   victools 경유로 구버전 swagger-annotations(2.2.31)를 끌어와 springdoc(swagger-core 2.2.47)의
	//   OpenAPI 문서 생성이 NoSuchMethodError(Schema.$dynamicRef)로 깨지므로 해당 전이 의존을 제외한다.
	//   (우리는 SDK의 swagger 기반 스키마 생성 기능을 쓰지 않음 — 순수 Messages 호출만 사용)
	implementation('com.anthropic:anthropic-java:2.34.0') {
		exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
	}
	// 장르 분류(ingestion)의 AI provider 통합 — Spring AI 2.0(Boot 4.0/4.1 + Framework 7.0 라인. 1.x는 Boot 3.x 전용).
	//   스타터가 아니라 core 모듈만 쓰고 GenreConfig에서 프로그래매틱 조립한다 —
	//   스타터 오토컨피그는 api-key가 없으면 컨텍스트 기동 자체를 실패시켜("Incomplete Google GenAI configuration")
	//   "키 없으면 AI만 비활성, 나머지는 정상"이라는 기존 계약(mock 분류기·로컬/CI 키 없음)을 깬다.
	implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
	//   1차(Gemini)만 올린다 — 2차 Claude(ClaudeGenreClassifier)는 anthropic-java SDK 그대로다. spring-ai-anthropic을
	//   쓰면 anthropic-java-core가 올라가며 구버전 swagger-annotations(2.2.31)를 끌어와 springdoc과 충돌하는데,
	//   얻는 건 "API 통일" 하나뿐이라 값이 안 된다(필요해지면 그때 exclude와 함께 추가).
	implementation 'org.springframework.ai:spring-ai-google-genai'
	//   ChatClient(프롬프트 조립·호출·응답 추출을 한 줄로 잇는 상위 API). google-genai가 전이로 끌고 오지만
	//   compile 클래스패스엔 안 올라와서 명시한다 — 우리가 직접 import하는 API라 명시가 맞다.
	implementation 'org.springframework.ai:spring-ai-client-chat'
	// OAuth 후 자체 JWT(access/refresh) 발급용
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'com.mysql:mysql-connector-j'
	// Micrometer Prometheus 레지스트리 — /actuator/prometheus 노출(에이전트가 스크랩 → Grafana Cloud)
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// 운영 구조화(JSON) 로깅 — 로그 수집기(Loki 등)에서 필드 검색 가능하게(prod 프로파일에서만 사용)
	implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	// CultureExhibitionClient 실HTTP 파싱 검증용 목 서버
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	// 'manual' 태그는 실제 외부 API를 호출하는 수동 확인용이라 자동 실행에서 제외한다(CI·로컬 전체 실행 모두).
	//   돌리려면 ./gradlew manualTest — IDE에서 개별 실행도 된다.
	useJUnitPlatform {
		excludeTags 'manual'
	}
	jvmArgs '-Duser.timezone=Asia/Seoul'
	finalizedBy tasks.named('jacocoTestReport')
}

// 수동 확인 전용 — 실제 외부 API를 호출한다(호출 한도 소모). 자동화 파이프라인에서 부르지 않는다.
tasks.register('manualTest', Test) {
	description = '실제 외부 API를 호출하는 수동 확인 테스트(@Tag("manual"))만 실행한다.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'manual'
	}
	jvmArgs '-Duser.timezone=Asia/Seoul'
	outputs.upToDateWhen { false }   // 매번 실제로 호출해 확인하는 게 목적이다
	testLogging {
		showStandardStreams = true
	}
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
}
