# 로그 로테이션 기본값 — 컨테이너 로그가 무한정 쌓여 디스크가 차는 것을 방지(각 서비스에 *default-logging 참조).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # 쓰기 원본(master). 복제본(mysql-replica)이 붙을 수 있게 GTID 복제를 켠다.
  #  - 기존 데이터 볼륨 그대로 재시작만으로 GTID가 켜진다(오프라인 전환은 한 번에 허용).
  #  - 복제 계정(repl)은 복제본의 첫 기동 초기화 스크립트가 멱등하게 만든다(db/replica-init.sh).
  mysql:
    image: 'mysql:8.4'
    container_name: modi-mysql
    # DB 서버 세션 시간대도 KST(앱 저장값과 정렬 — NOW()·직접 조회 시 헷갈리지 않게).
    command:
      [
        '--default-time-zone=+09:00',
        '--server-id=1',
        '--gtid_mode=ON',
        '--enforce_gtid_consistency=ON',
      ]
    logging: *default-logging
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
      - 'TZ=Asia/Seoul'
    ports:
      - '3306:3306'
    volumes:
      - 'mysql-data:/var/lib/mysql'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pverysecret']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 읽기 복제본 — readOnly 트랜잭션이 여기로 온다(DataSourceConfig의 라우팅, app-1·app-2의
  # APP_DATASOURCE_REPLICA_URL이 스위치). 'app' 프로파일이라 로컬 bootRun(mysql·redis만 자동기동)은 영향 없음.
  #  - 첫 기동(빈 볼륨)에만 db/replica-init.sh가 원본을 덤프로 시딩하고 GTID 복제를 건 뒤
  #    read_only를 PERSIST로 잠근다. 이후 기동은 볼륨에 남은 복제 설정으로 그냥 이어 돈다.
  #  - 복제를 처음부터 다시 시딩하려면 replica 볼륨만 지우면 된다: docker volume rm <프로젝트>_mysql-replica-data
  mysql-replica:
    image: 'mysql:8.4'
    container_name: modi-mysql-replica
    profiles: ['app']
    command:
      [
        '--default-time-zone=+09:00',
        '--server-id=2',
        '--gtid_mode=ON',
        '--enforce_gtid_consistency=ON',
        '--relay-log=relay-bin',
      ]
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 원본과 같은 초기화 값 — 시딩 전 빈 DB·계정을 같은 모양으로 만들어 두고, 실제 데이터는 덤프가 채운다.
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
      - 'TZ=Asia/Seoul'
    volumes:
      - 'mysql-replica-data:/var/lib/mysql'
      - './db/replica-init.sh:/docker-entrypoint-initdb.d/replica-init.sh:ro'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pverysecret']
      interval: 10s
      timeout: 5s
      retries: 12
      # 첫 기동은 원본 덤프 시딩까지 포함 — 넉넉히 기다린다.
      start_period: 90s

  # 두 가지 용도를 함께 진다.
  #  - AI '질문으로 작성' 임시저장(draft) 캐시 및 전시 조회 캐시: 전부 TTL을 걸고 쓴다(CacheConfig의 entryTtl).
  #  - 전시 수집 파이프라인(ingestionv2)의 이벤트 스트림: 유실이 곧 전시 누락이라 휘발되면 안 된다.
  # 그래서 캐시 전용이던 설정을 다음과 같이 바꿨다.
  #  - appendonly yes + redis-data 볼륨: 스트림이 재시작과 컨테이너 재생성을 견디게 한다.
  #    AOF만 켜고 볼륨을 안 붙이면 컨테이너를 다시 만들 때 스트림이 통째로 사라진다.
  #  - volatile-lru: TTL이 있는 키(=캐시)만 축출 대상이라 캐시는 예전처럼 밀려나고 스트림은 남는다.
  #    allkeys-lru면 스트림이 축출되어 전시가 조용히 사라지고, noeviction이면 상한에 닿는 순간
  #    캐시 쓰기까지 실패한다. 둘 다 피하려면 축출 대상을 TTL 유무로 가르는 이 정책이 맞다.
  #  - maxmemory 192mb: 스트림이 캐시와 같은 인스턴스를 쓰게 되어 64mb에서 올렸다(1GB EC2 기준 여유 유지).
  # spring-boot-docker-compose(developmentOnly)가 이 서비스를 로컬 bootRun에서 자동기동·자동연결한다.
  redis:
    image: 'redis:7-alpine'
    container_name: modi-redis
    logging: *default-logging
    command: ['redis-server', '--save', '', '--appendonly', 'yes', '--maxmemory', '192mb', '--maxmemory-policy', 'volatile-lru']
    volumes:
      - 'redis-data:/data'
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # The application services are gated behind the "app" compose profile so that
  # Spring Boot's dev-time docker-compose integration (during `./gradlew bootRun`)
  # only starts MySQL/Redis. Run the full stack with:  docker compose --profile app up --build
  #
  # 앱은 두 대(app-1·app-2)가 같은 이미지를 나눠 쓰고, 외부 트래픽은 nginx 한 곳으로만 들어온다.
  #  - 같은 이미지: build는 app-1에만 있고 app-2는 태그(modi-backend-app)를 재사용 — 배포는 빌드 1회.
  #  - 호스트 포트: 앱 자체는 루프백(18081·18082)에만 열어 롤링 배포 헬스체크 전용으로 쓰고,
  #    공개 포트는 nginx가 그대로 이어받는다(APP_HOST_PORT) — 밖에서 보면 서버가 늘어난 걸 모른다.
  #  - Redis Streams 컨슈머 이름은 비우면 호스트명(컨테이너별로 다름) — 두 대가 자동으로 구분된다.
  app-1:
    build:
      context: .
    image: modi-backend-app
    container_name: modi-backend-1
    profiles: ['app']
    logging: *default-logging
    depends_on: &app-deps
      mysql:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app-env
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/mydatabase?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true'
      - 'TZ=Asia/Seoul'
      - 'SPRING_DATASOURCE_USERNAME=myuser'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
      # AI 임시저장(draft) 캐시 — 기본은 같은 compose 네트워크의 redis 서비스명(운영 배포도 동일).
      #   `:-` 형태라 .env에 없거나 빈값이어도 'redis'로 폴백한다(외부 Redis로 옮길 땐 .env에서 이 값만 교체).
      - 'SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-redis}'
      # 비어 있으면 default 프로파일(=로컬 CORS). 운영 배포는 .env로 prod 주입(=Vercel CORS).
      - 'SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}'
      # OAuth/JWT 시크릿: .env로 주입(배포 시 GitHub Actions secrets → deploy.yml이 .env에 기록).
      # client-id·redirect-uri·CORS는 application.yaml prod 기본값(공개 정보)이라 여기서 안 넣는다.
      # ⚠️ 빈 문자열을 넘기면 application.yaml의 `${VAR:기본값}`이 "변수 존재"로 보고 빈값을 써버린다.
      #    특히 JWT_SECRET이 빈값이면 0바이트 키로 부팅 크래시(WeakKeyException) → .env 없이도 뜨도록 로컬 기본값 폴백.
      - 'KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET:-}'
      - 'GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}'
      # 네이버. ⚠️ 여기 빠뜨리면 .env에 값이 있어도 컨테이너는 못 본다 —
      #   compose의 .env는 compose 파일 안 ${VAR} 치환용일 뿐 컨테이너에 자동 주입되지 않는다.
      #   (2026-07-19 운영 장애: .env엔 정상인데 컨테이너 안은 빈 값이라 네이버가
      #    "client_secret is missing."으로 거부 → OAUTH_COMMUNICATION_FAILED)
      #   client-id는 공개값이라 기본값을 박는다 — 위 ⚠️대로 빈 문자열을 넘기면
      #   application.yaml의 기본 client-id를 빈값으로 덮어써 버리기 때문.
      - 'NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-x5SSFHxy06Npeieb9JlA}'
      - 'NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-}'
      - 'JWT_SECRET=${JWT_SECRET:-local-dev-only-jwt-secret-please-change-min-32-bytes}'
      # AI 감상문 생성용 Anthropic 키(.env로 주입). 비어 있으면 AI 엔드포인트만 503, 나머지는 정상.
      - 'ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}'
      # 전시 장르 AI 분류(Gemini). 미설정(빈값)이면 AI 분류기가 random으로 폴백 → 크래시 없음.
      #   model·base-url은 여기서 넘기지 않는다 — 빈값을 넘기면 application.yaml 기본값(gemini-2.5-flash 등)을 덮어써 버림.
      - 'GEMINI_API_KEY=${GEMINI_API_KEY:-}'
      # 전시 장르 폴백 체인의 2차 공급자(OpenAI). 미설정(빈값)이면 1차 실패 시 2차 전환도 실패 →
      #   아웃박스 RETRYABLE로 남아 다음 주기 재시도(크래시 없음). model은 넘기지 않는다(빈값이 yaml 기본값을 덮음).
      - 'OPENAPI_KEY=${OPENAPI_KEY:-}'
      # record-AI 감상문 키. 미설정이면 AI 엔드포인트만 503, 나머지 정상.
      - 'AI_API_KEY=${AI_API_KEY:-}'
      # 관리자 콘솔 로그인(이메일 화이트리스트 + 공용 비번). 미설정(빈값)이면 admin 로그인 불가 → 나머지 기능 정상.
      - 'ADMIN_EMAILS=${ADMIN_EMAILS:-}'
      - 'ADMIN_PASSWORD=${ADMIN_PASSWORD:-}'
      # 공공데이터(전시) 인증키는 application.yaml에 기본값으로 박아 뒀다 → compose에서 CULTURE_API_KEY를 주입하지 않는다.
      #   (여기서 `CULTURE_API_KEY=${CULTURE_API_KEY:-}`로 빈값을 넘기면 Spring이 "변수 존재=빈값"으로 보고 yaml 기본값을 덮어써 버림.)
      #   env로 바꾸고 싶으면 이 줄을 살리되 반드시 실제 값이 채워질 때만 넘길 것.
      # 읽기/쓰기 분리 스위치 — 이 값이 있어야 DataSourceConfig가 라우팅을 등록한다(readOnly → 복제본).
      #   ⚠️ .env 치환(${...:-})으로 빈값을 넘기면 "속성 존재"로 보고 빈 URL 풀을 만들다 부팅이 죽는다 → 값을 직접 박는다.
      #   복제본 없이 원본만으로 돌리고 싶으면 이 줄을 지우면 된다(자동구성 단일 DataSource로 복귀).
      - 'APP_DATASOURCE_REPLICA_URL=jdbc:mysql://mysql-replica:3306/mydatabase?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true'
      # 한 박스에 앱 2대 + DB 2대가 같이 사는 t3.small(2GB) 기준 힙 상한 — 기본값(호스트 RAM 25%)이
      #   인스턴스 확장으로 512MB×2까지 커지는 걸 막는다(이전 t2.micro 시절 실효 힙 256MB와 같은 급).
      - 'JAVA_OPTS=-Xmx320m'
    ports:
      # 앱 직통 포트는 롤링 배포 헬스체크 전용 — 루프백에만 연다(외부 공개는 nginx의 APP_HOST_PORT 하나).
      - '127.0.0.1:18081:8080'

  app-2:
    image: modi-backend-app
    container_name: modi-backend-2
    profiles: ['app']
    logging: *default-logging
    depends_on: *app-deps
    environment: *app-env
    ports:
      - '127.0.0.1:18082:8080'

  # 앱 두 대 앞의 단일 관문. 공개 포트(APP_HOST_PORT)를 단일 앱 시절 그대로 이어받아
  # 프론트·OAuth 리다이렉트·외부 API가 서버가 늘어난 사실을 모르게 한다.
  #  - 롤링 배포 중 한 대가 내려가면 nginx가 나머지 한 대로 넘긴다(max_fails + proxy_next_upstream).
  #  - 앱 컨테이너가 재생성되어 IP가 바뀌면 deploy.yml이 nginx -s reload로 다시 해석시킨다.
  #  - restart: 첫 기동 순서상 앱보다 먼저 뜨면 업스트림 DNS 해석 실패로 죽을 수 있어 재시도로 복구한다.
  nginx:
    image: 'nginx:1.27-alpine'
    container_name: modi-nginx
    profiles: ['app']
    logging: *default-logging
    depends_on:
      - app-1
      - app-2
    volumes:
      - './nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
    ports:
      # 호스트 노출 포트는 env로 바꾼다. 로컬은 기본 18090(8080은 다른 로컬 컨테이너와 충돌 잦음, README·Postman과 일치),
      # 운영(EC2 배포)은 deploy.yml의 .env가 APP_HOST_PORT=8080을 주입해 공개 주소·헬스체크(localhost:8080)와 맞춘다.
      - '${APP_HOST_PORT:-18090}:80'
    restart: unless-stopped

  # 관측 에이전트(Grafana Alloy) — 앱 /actuator/prometheus 스크랩 → Grafana Cloud remote_write.
  # 별도 'obs' 프로파일이라 자격증명(GC_*) 없이도 기존 `--profile app` 실행은 그대로 동작한다.
  # 사용:  docker compose --profile app --profile obs up -d   (.env에 GC_* 채운 뒤)
  alloy:
    image: 'grafana/alloy:latest'
    container_name: modi-alloy
    profiles: ['obs']
    depends_on:
      - app-1
      - app-2
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - './observability/config.alloy:/etc/alloy/config.alloy:ro'
      # 컨테이너 로그 수집(Phase 2)용 — 도커 소켓 읽기 전용.
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    environment:
      # Grafana Cloud 자격증명(.env / GitHub Actions secrets). 비어 있으면 remote_write 실패하므로 obs 프로파일을 켜지 말 것.
      - 'GC_PROM_URL=${GC_PROM_URL:-}'
      - 'GC_PROM_USER=${GC_PROM_USER:-}'
      - 'GC_API_KEY=${GC_API_KEY:-}'
      # 로그(Loki) 자격증명 — 있으면 컨테이너 로그도 Grafana Cloud로 전송(Phase 2). 없으면 로그 전송만 스킵.
      - 'GC_LOKI_URL=${GC_LOKI_URL:-}'
      - 'GC_LOKI_USER=${GC_LOKI_USER:-}'
      # 인스턴스 라벨(환경 구분). 로컬은 기본 modi-backend-local, 운영은 deploy.yml이 modi-backend-prod 주입.
      - 'GC_INSTANCE=${GC_INSTANCE:-}'
    ports:
      # Alloy 자체 UI/디버그. 외부 노출 금지 → 루프백에만 바인딩.
      - '127.0.0.1:12345:12345'
    restart: unless-stopped

  # 사용자 지표(제품 분석) — Metabase가 MySQL(읽기전용)에 붙어 대시보드 제공.
  # 'analytics' 프로파일이라 필요할 때만: docker compose --profile app --profile analytics up -d
  # 외부 노출 금지(루프백) → SSH 터널/VPN로 접근. MB 자체 저장소는 볼륨(H2)로 영속화.
  metabase:
    image: 'metabase/metabase:latest'
    container_name: modi-metabase
    profiles: ['analytics']
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 자체 저장소는 볼륨(H2)에 영속화. 단일 관리자 내부용엔 충분(동시 다수 사용 시 MySQL 앱DB로 분리 권장 — 문서 참고).
      - 'MB_DB_TYPE=h2'
      - 'MB_DB_FILE=/metabase-data/metabase.db'
      # cloudflared 뒤에 있을 때 리다이렉트/쿠키가 https 기준이 되게(운영 hostname은 CF가 HTTPS 종료).
      - 'MB_SITE_URL=${MB_SITE_URL:-}'
    volumes:
      - 'metabase-data:/metabase-data'
    ports:
      # 기본은 루프백만(로컬 안전). 운영에서 EC2 Public IP로 직접 공개할 땐 MB_HOST_PORT=3000(=0.0.0.0:3000)으로 오버라이드.
      #   ⚠️ public 노출은 http 평문 — 보안그룹으로 접근 IP를 제한할 것. HTTPS가 필요하면 cloudflared(터널) 경유.
      - '${MB_HOST_PORT:-127.0.0.1:3001}:3000'
    restart: unless-stopped

  # Cloudflare Tunnel — Metabase를 HTTPS 고정 주소로 외부 공개(팀 상시 접속). 도커 소켓/포트 개방 불필요.
  # 'tunnel' 프로파일 + CF_TUNNEL_TOKEN 있을 때만. 토큰은 Cloudflare Zero Trust에서 터널 생성 시 발급.
  # 공개 hostname → 서비스는 CF 대시보드에서 http://metabase:3000 으로 지정(같은 compose 네트워크).
  cloudflared:
    image: 'cloudflare/cloudflared:latest'
    container_name: modi-cloudflared
    profiles: ['tunnel']
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      - 'TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}'
    depends_on:
      - metabase
    restart: unless-stopped
    logging: *default-logging

  # (대안) 도메인 없이 quick tunnel — metabase를 임시 HTTPS URL로 공개. named(위)와 택일.
  # ⚠️ URL이 재시작마다 바뀜 + Cloudflare 운영 비권장. EC2 상시는 되지만 '고정 주소'는 아님.
  # 'tunnel-quick' 프로파일. 발급 URL은 로그에서:  docker logs modi-cloudflared-quick | grep trycloudflare
  cloudflared-quick:
    image: 'cloudflare/cloudflared:latest'
    container_name: modi-cloudflared-quick
    profiles: ['tunnel-quick']
    command: ['tunnel', '--no-autoupdate', '--url', 'http://metabase:3000']
    depends_on:
      - metabase
    restart: unless-stopped
    logging: *default-logging

volumes:
  mysql-data:
  # 읽기 복제본 데이터. 지우면 다음 기동 때 원본 덤프로 재시딩된다(db/replica-init.sh).
  mysql-replica-data:
  metabase-data:
  # 수집 파이프라인 이벤트 스트림의 AOF 보존용. 캐시는 TTL로 사라져도 무해하지만
  # 스트림이 사라지면 그 회차의 전시가 다음 단계로 진행되지 못한 채 누락된다.
  redis-data:
