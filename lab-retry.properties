# 재시도·DLQ lab 하네스 파라미터. 이 파일만 고쳐서 실험 조건을 전환한다.
#   - Gradle Test 태스크는 CLI 의 -D 를 포크된 테스트 JVM 으로 넘기지 않는다. 이 파일이 유일하게 확실한 경로다.
#   - 아웃박스 실험의 lab-outbox.properties 와 키 접두사가 다르다(lab.retry.*).
#   - 값을 지우면 RetryLabConfig 의 기본값(= 계획서 값)이 그대로 쓰인다.

lab.retry.n=3
lab.retry.warmup=1

# --- step-07 재처리 동시성 ---
lab.retry.redrive.rows=200
lab.retry.redrive.threads=50
# Phase A: P0 만. @Version(V58) 적용 전 커밋에서 돌린다.
# Phase B: 아래 줄로 바꾼다 -> lab.retry.redrive.variants=V1,V2,V3
lab.retry.redrive.variants=P0
lab.retry.redrive.lockSampleMs=20

# --- step-04 소비 재전달 백오프 ---
lab.retry.reclaim.rows=10000
lab.retry.reclaim.windowSeconds=60
lab.retry.reclaim.tickMs=1000
lab.retry.reclaim.failurePercent=30
lab.retry.reclaim.outageSeconds=20
lab.retry.reclaim.faultSeed=20260829

# 원시 파일 뿌리. 비우면 재시도·DLQ 실험 문서 폴더의 _workspace/03_measurer_raw.
# lab.retry.rawRoot=

# --- step-06 DLQ 조회(limit 200 단일) ---
lab.retry.dlq.limits=200
