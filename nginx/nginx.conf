# 앱 두 대(app-1·app-2) 앞의 단일 관문. 공개 포트는 compose가 이 서버의 80을
# APP_HOST_PORT(운영 8080, 로컬 18090)로 이어붙인다 — 밖에서 보면 단일 앱 시절과 주소가 같다.
upstream backend {
    # 접속 수가 적은 쪽으로 — SSE(감상문 스트리밍)처럼 오래 잡는 연결이 한쪽에 몰리지 않게.
    least_conn;
    # 롤링 배포로 한 대가 내려가면 3회 실패 후 3초간 제외 → 남은 한 대가 전부 받는다.
    server app-1:8080 max_fails=3 fail_timeout=3s;
    server app-2:8080 max_fails=3 fail_timeout=3s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Host를 그대로 넘겨 앱이 보는 요청 주소가 프록시 이전과 동일하게 유지된다
        # (CORS·OAuth 리다이렉트는 설정값 기반이라 원래도 무관하지만, 요청 기반 URL 생성까지 안전하게).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 죽은 인스턴스로 간 요청은 산 쪽으로 재시도 — 롤링 배포 중 무중단의 핵심.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;

        # AI 감상문 SSE(RecordAiV1Controller)가 오래 흐른다 — 버퍼링을 끄고 읽기 타임아웃을 넉넉히.
        proxy_buffering off;
        proxy_read_timeout 300s;

        client_max_body_size 20m;
    }
}
