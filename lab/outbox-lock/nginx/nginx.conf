# 앱 두 대 앞의 역방향 프록시. 운영 구성 재현용이고 측정 경로가 아니다
# (부하는 각 앱의 발송 스케줄러가 스스로 만든다).
upstream backend {
    least_conn;
    server app1:8080;
    server app2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
